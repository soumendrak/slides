<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Notes fixture</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/reset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/theme/night.min.css">
</head>
<body>
  <!-- A deck that loads reveal.js's notes plugin, like talks with a speaker view. -->
  <div class="reveal"><div class="slides">
    <section><h2>One</h2><aside class="notes">notes for one</aside></section>
    <section><h2>Two</h2><aside class="notes">notes for two</aside></section>
    <section><h2>Three</h2><aside class="notes">notes for three</aside></section>
  </div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/reveal.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/plugin/notes.min.js"></script>
  <script>Reveal.registerPlugin(RevealNotes);</script>
  <script src="../../shared/scripts/slides.js"></script>
</body>
</html>
