## "All systems performed nominally"

<figure>
<img src="assets/mco-figure4-encounter-diagram.webp" alt="NASA schematic of the Mars Climate Orbiter encounter: the estimated trajectory passes 226 km above Mars, the actual trajectory 57 km">
<figcaption>Figure 4, "Schematic MCO Encounter Diagram", Mars Climate Orbiter Mishap Investigation Board Phase I Report, NASA, 10 Nov 1999, p. 14.<br>
Source: <a href="https://llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf">https://llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf</a></figcaption>
</figure>

<p class="medium">One ground file reported thruster data in pound-force-seconds. Navigation expected newton-seconds. <span class="red">lbf-s ≠ N-s</span></p>

Note:
Recommended opener: Candidate 2. Full script, backup facts and every caveat: speaker-notes/opening-story.md.

Script (~230 words, about 1 min 45 s):
On 11 December 1998, NASA launched the Mars Climate Orbiter. It was supposed to be the first weather satellite for another planet. Together with its sister lander, the project cost 327.6 million dollars.
For nine months it flew towards Mars. On 23 September 1999 it fired its engine to go into orbit. NASA's investigation report says: "All systems performed nominally" until the spacecraft went behind Mars. The signal never came back.
What went wrong? One ground software file, called "Small Forces", gave thruster data in pound-seconds. The navigation software expected newton-seconds. Nothing crashed and no alarm went off. Every number looked like a valid number. But each one was off by a factor of 4.45. Small errors added up over nine months. The spacecraft came in about 170 kilometres lower than planned and was lost.
Here is the painful part. For months, people on the team had noticed that the navigation numbers did not agree. The report says these were "only informally reported", sorted out over e-mail, and "not resolved".
So the system was healthy and the outcome was wrong. Every component said "I'm fine." Nobody was checking whether the answer made sense.

Sources:
- Launch 11 Dec 1998; "All systems performed nominally until Mars's occultation loss of signal"; Small Forces in lbf-s vs N-s, factor 4.45; about 170 km lower than planned; 57 km periapsis vs 80 km survivable; "only informally reported", "not resolved", "relied on e-mail": NASA MIB Phase I Report, https://llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf (also NASA LLIS lesson 641, https://llis.nasa.gov/lesson/641)
- CAVEAT: $327.6M is "total for both orbiter and lander (not including Deep Space 2)". It covers the orbiter plus the Mars Polar Lander, not the orbiter alone. Say "the project" or "the two missions together". https://web.archive.org/web/20121003073752/http://mars.jpl.nasa.gov/msp98/orbiter/fact.html
- Figure 4 is on page 14 of the same report. It shows the estimated trajectory (226 km) against the actual one (57 km). Not to scale.

## Checkpoint 2: mean vs percentiles

- Guess your p99 from your mean, then read the last line of `ws load`
- 99 runs at 1 s plus one at 30 s: mean 1.29 s, median 1 s
- With 50 runs, p99 is your slowest run or two. An illustration, not an estimate.
- Tools compute percentiles differently. Langfuse may differ a little.

Note:
Block 9 (00:40 to 00:45). Worksheet uses the ws load numbers (nearest rank).
Nearest-rank p99 of 50 values is the maximum; numpy's default linear method interpolates between the two largest: https://numpy.org/doc/stable/reference/generated/numpy.percentile.html
1.29 s = (99 × 1 + 30) / 100, my own calculation.
Offline: ws load -n 50 --exporter console prints the same line.

## Why tails matter for agents

<div class="code-block">P(at least one slow step) = 1 − 0.99ⁿ</div>

- n = 10 steps: 9.6%
- n = 25 steps: 22.2%

Intuition, not a prediction. Real steps aren't independent. <!-- .element: class="smaller dim" -->

Note:
Block 9. Assumes each step independently has a 1% chance of hitting its p99. My own calculation.
The Tail at Scale reports 63% at fan-out 100: https://cacm.acm.org/research/the-tail-at-scale/
A slow model or backend slows several steps at once. Details: Appendix, reliability compounding.

## Appendix: percentiles on small samples

- n = 50: nearest-rank p99 is rank ⌈0.99 × 50⌉ = 50, the maximum
- numpy default (linear): position 0.99 × 49 = 48.51
- A p99 you can trust needs hundreds of runs. Use p50 and p95 for small samples.

Note: B0. Source: https://numpy.org/doc/stable/reference/generated/numpy.percentile.html. Langfuse's method is not documented on the pages checked.

--

## Appendix: reliability compounding

- Per-step success multiplies: 0.95¹⁰ = 59.9%, 0.99¹⁰ = 90.4%
- 1 − 0.99ⁿ: n = 5 → 4.9%, 10 → 9.6%, 25 → 22.2%, 50 → 39.5%, 100 → 63.4%
- Assumes independent, identical steps. Real steps are correlated.

Note: B1. Own calculations. Fan-out reference: https://cacm.acm.org/research/the-tail-at-scale/

--

## Appendix: pass@k vs pass^k

- pass@k: at least one of k tries succeeds
- pass^k: all k tries succeed
- p = 0.7: pass@3 = 97.3%, pass^3 = 34.3%
- Use pass^k for agents that act on behalf of users

Note:
B2. pass@k: https://arxiv.org/abs/2107.03374 · pass^k: https://arxiv.org/abs/2406.12045 (reports "pass^8 <25% in retail").
97.3% = 1 − 0.3³ and 34.3% = 0.7³, own calculations.

--

## Appendix: confidence intervals

| Result | 95% Wilson interval |
| --- | --- |
| 9/10 | 59.6% to 98.2% |
| 45/50 | 78.6% to 95.7% |
| 450/500 | 87.1% to 92.3% |
| 44/50 vs 46/50 | 76.2-94.4% vs 81.2-96.8%: they overlap |
<!-- .element: class="comparison-table" -->

±5 points at p = 0.5 needs about 384 samples; ±3 needs about 1,067. Rule of three: 0 failures in n runs → upper bound about 3/n. <!-- .element: class="smaller" -->

Note:
B3. Own calculations (Wilson score interval). Method reference: https://en.wikipedia.org/wiki/Binomial_proportion_confidence_interval#Wilson_score_interval
Rule of three: https://en.wikipedia.org/wiki/Rule_of_three_(statistics)

--

## Appendix: base rates and alert precision

- Sensitivity 95%, specificity 95%, 2% of runs bad
- Precision = 0.95×0.02 / (0.95×0.02 + 0.05×0.98) = 28%
- At 1,000 runs a day: 19 true alarms, 49 false
- Alert on windowed rates. Read them next to the sample count.

Note: B4. Own calculation (Bayes). Reference: https://en.wikipedia.org/wiki/Base_rate_fallacy

--

## Appendix: burn rate

- A 99% SLO leaves a 1% error budget
- Burn rate 14.4 spends 2% of a 30-day budget in 1 hour
- Page at 2% in 1 hour or 5% in 6 hours. Ticket at 10% in 3 days.
- Check a short window at the same time

Note: B5. Source: https://sre.google/workbook/alerting-on-slos/. Example rules: observability-engineering-series ch11, https://github.com/soumendrak/observability-engineering-series

--

## Appendix: sampling and PII

- Uniform 5% sampling keeps about 1 of 20 daily failures
- Tail sampling: keep 100% of errors, 100% of slow runs, 5% of normal runs
- Redact prompts, emails and IDs before export
- Run the redaction before tail sampling in the Collector

Note:
B6. Own calculation for the 1 in 20. Collector tail sampling: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/tailsamplingprocessor
Example config: observability-engineering-series ch9, https://github.com/soumendrak/observability-engineering-series

--

## Appendix: calibrating an LLM judge

- Label 20 to 50 runs by hand
- Measure agreement with the judge
- Fix the rubric before you trust its rate
- Judges cost tokens on every scored observation

Note: B7. Source: https://langfuse.com/docs/evaluation/evaluation-methods/llm-as-a-judge
