## "All systems performed nominally"

<figure>
<img src="assets/mco-figure4-encounter-diagram.webp" alt="NASA schematic of the Mars Climate Orbiter encounter: the estimated trajectory passes 226 km above Mars, the actual trajectory 57 km">
</figure>

<p class="medium">One ground file reported thruster data in pound-force-seconds. Navigation expected newton-seconds. <span class="red">lbf-s ≠ N-s</span></p>

Note:
- Full script, backup facts and every caveat: speaker-notes/opening-story.md.
- Script (~230 words, about 1 min 45 s):
    - On 11 December 1998, NASA launched the Mars Climate Orbiter. [1]
    - It was supposed to be the first weather satellite for another planet.
    - Together with its sister lander, the project cost 327.6 million dollars. [3]
    - For nine months it flew towards Mars. On 23 September 1999 it fired its engine to go into orbit.
    - NASA's investigation report says: "All systems performed nominally" until the spacecraft went behind Mars. The signal never came back. [1]
    - What went wrong? One ground software file, called "Small Forces", gave thruster data in pound-seconds. The navigation software expected newton-seconds. [1]
    - Nothing crashed and no alarm went off. Every number looked like a valid number.
    - But each one was off by a factor of 4.45. Small errors added up over nine months. [1]
    - The spacecraft came in about 170 kilometres lower than planned and was lost. [1]
    - Here is the painful part. For months, people on the team had noticed that the navigation numbers did not agree.
    - The report says these were "only informally reported", sorted out over e-mail, and "not resolved". [1]
    - So the system was healthy and the outcome was wrong. Every component said "I'm fine." Nobody was checking whether the answer made sense.
- Backup facts from the report: [1] [2]
    - Launch 11 Dec 1998; "All systems performed nominally until Mars's occultation loss of signal".
    - Small Forces in lbf-s vs N-s, factor 4.45; about 170 km lower than planned.
    - 57 km periapsis vs 80 km survivable.
    - "only informally reported", "not resolved", "relied on e-mail".
- CAVEAT: $327.6M is "total for both orbiter and lander (not including Deep Space 2)". [3]
    - It covers the orbiter plus the Mars Polar Lander, not the orbiter alone.
    - Say "the project" or "the two missions together".
- Slide figure: Figure 4, "Schematic MCO Encounter Diagram", Mars Climate Orbiter Mishap Investigation Board Phase I Report, NASA, 10 Nov 1999, p. 14. [1]
    - It shows the estimated trajectory (226 km) against the actual one (57 km). Not to scale.

Sources:

1. [NASA MCO Mishap Investigation Board Phase I Report](https://llis.nasa.gov/llis_lib/pdf/1009464main1_0641-mr.pdf)
2. [NASA LLIS lesson 641](https://llis.nasa.gov/lesson/641)
3. [JPL MCO fact sheet (archived)](https://web.archive.org/web/20121003073752/http://mars.jpl.nasa.gov/msp98/orbiter/fact.html)

## Anatomy of a span

- A <span class="highlight">span</span> has a name, start, duration, status, attributes and a parent
- A <span class="highlight">trace</span> is a tree of spans for one request
- A <span class="highlight">log</span> is one event. A <span class="highlight">metric</span> is an aggregate.

Find your trace ID, the root, and shout your span count. <!-- .element: class="quote" -->

Note:
- Block 5 (00:16 to 00:21).
- Say:
    - A span is one step, with a start, an end and a status.
    - A trace is every step of one request, as a tree.
    - Logs are single events, metrics are totals. The trace shows what caused what.
- Optional 10 s demo of plain vs structured logs from observability-engineering-series ch1. [3]
- Definitions follow OpenTelemetry. [1] [2]

Sources:

1. [OpenTelemetry: traces](https://opentelemetry.io/docs/concepts/signals/traces/)
2. [OpenTelemetry: signals](https://opentelemetry.io/docs/concepts/signals/)
3. [observability-engineering-series on GitHub](https://github.com/soumendrak/observability-engineering-series)

## OpenTelemetry GenAI names

- `invoke_agent`: an agent run
- `execute_tool`: a tool call
- `gen_ai.tool.call.arguments`: what the tool was given

Status: Development. Names can still change. <!-- .element: class="fine" -->

Note:
- Block 8. 60 seconds.

## Checkpoint 2: mean vs percentiles

<p class="latency-lead">50 complete requests: <strong>49 wait 1 s</strong>, <strong class="latency-warm">one waits 30 s</strong>.</p>

<div class="latency-overview">
<div>
<div class="latency-ranks" data-latency-ranks role="img" aria-label="50 waits sorted shortest to longest: ranks 1 to 49 are 1 second; rank 50 is 30 seconds"></div>
<p class="latency-caption">Sorted left to right, then top to bottom. Each tile is one request.</p>
</div>
<div class="latency-summary">
<p><span>Mean: add and divide</span><strong>(49 × 1 + 30) / 50 = 1.58 s</strong></p>
<p><span>Median: middle two waits</span><strong>(1 + 1) / 2 = 1 s</strong></p>
<p><span>Nearest-rank percentiles</span><strong>p95 = 1 s · p99 = 30 s</strong></p>
</div>
</div>

<div class="latency-controls" aria-label="Inspect a percentile">
<button type="button" data-latency-percentile="95" aria-pressed="false">Show p95</button>
<button type="button" data-latency-percentile="99" aria-pressed="true">Show p99</button>
<span data-latency-rank-explanation aria-live="polite">p99: ⌈0.99 × 50⌉ = rank 50 → 30 s</span>
</div>

<div class="latency-method">
<pre><code class="mermaid">flowchart LR
S["Sort the waits"] --> R["Rank = ceil(p / 100 × N)"] --> V["Read the wait at that rank"]</code></pre>
</div>

<p class="latency-takeaway">The mean alone cannot tell you p99. Compare both in <code>ws load</code>. <a href="#/agent-tail">Why agent steps matter → appendix</a></p>

Note:
- Block 9 (00:36 to 00:41).
- Teaching sequence, about 3 minutes, then compare the load output:
    - Point at the tiles. Each is one complete request, not a step. Forty-nine people waited 1 second; the last waited 30 seconds.
    - Add all individual durations: 49 × 1 + 30 = 79 seconds. Divide by 50 requests: mean 1.58 seconds. Nobody in this example waited 1.58 seconds.
    - The median averages sorted ranks 25 and 26; both are 1 second.
    - Click Show p95. Calculate 0.95 × 50 = 47.5, round up to rank 48, then read 1 second. The chosen tile is outlined and labelled.
    - Click Show p99. Calculate 0.99 × 50 = 49.5, round up to rank 50, then read 30 seconds.
    - A nearest-rank percentile is a cutoff with at least that percentage of sampled waits at or below it. Ties can include more: 98% are at or below 1 second; 100% are at or below 30 seconds here.
    - Ask: if all 50 requests instead took 1.58 seconds, would the mean change? No. Would p99 change? Yes, to 1.58 seconds. We cannot derive p99 from the mean.
    - Read the last line of ws load. Compare mean and tail percentiles, and state the sample count.
- The worksheet uses the ws load numbers (nearest rank).
- For this sample, nearest-rank p99 is the maximum. It is not a stable estimate of production p99. [1]
- NumPy's default linear method gives 15.79 seconds here: zero-based position 48.51, then 1 + 0.51 × (30 − 1). Other percentile methods can disagree. [1]
- Conventional median and nearest-rank p50 can differ on other even-sized samples. They match here because the middle values tie.
- 1.58 s = (49 × 1 + 30) / 50, my own calculation.
- Offline: ws load -n 50 --exporter console prints the same line.
- The linked appendix introduces a separate model for steps inside one request. Teach it separately; its 1% per-step assumption is not the 2% slow-request share in this example.

## Three gulfs in building AI systems

<figure class="original-gulfs">
<img src="assets/oreilly-aiee-0101.png" alt="Original diagram: Developer to LLM agent across the Gulf of Specification; LLM agent to Data across the Gulf of Generalization; Data back to Developer across the Gulf of Comprehension.">
<figcaption>Source: <a href="https://learning.oreilly.com/api/v2/epubs/urn:orm:book:9798341660717/files/assets/aiee_0101.png">O’Reilly · original diagram</a></figcaption>
</figure>

Note:
- Comprehension: You don’t yet understand what your inputs look like or how the system actually behaves on them; look at more traces before changing anything.
- Specification: Your requirements aren’t explicit enough for the LLM to follow; revise the prompt or agent logic to close the gap.
- Generalization: The requirements are clear, but the LLM still fails on some inputs. Measure how often the failure occurs, and consider stronger interventions like more examples, better retrieval, or fine-tuning.

Sources:

1. [O’Reilly source diagram, asset aiee_0101.png](https://learning.oreilly.com/api/v2/epubs/urn:orm:book:9798341660717/files/assets/aiee_0101.png)

## How to build evals

### 1. Error analysis: discover what goes wrong

```mermaid
flowchart LR
    traces["Collect diverse traces"] --> review["Human review: write open notes"] --> groups["Group and prioritize failures"]
```

<p><strong>Human annotation starts inside error analysis.</strong> Review examples before finalizing a rubric.</p>

### 2. Turn important failures into repeatable checks

```mermaid
flowchart LR
    criteria["Define pass / fail"] --> build["Build code check or judge"] --> validate["Validate the evaluator"] --> repeat["Rerun after changes"]
```

<p class="workflow-loop">↺ New failures → review more traces and update the criteria and eval set.</p>
<p class="workflow-source">Adapted from <a href="https://hamel.dev/blog/posts/evals-faq/">Hamel Husain &amp; Shreya Shankar · AI Evals FAQ</a></p>

Note:
- Block 21, opening Part 4 within 01:36 to 01:41. About 60 seconds here, then Three ways to score quality and the existing poll. Do not extend the workshop.
- This is a simplified synthesis of the FAQ, not its exact diagram or a quotation. Human annotation is part of error analysis, not a separate step that begins only after error analysis finishes.
- Point along the first row: "Collect traces covering different real uses. A person familiar with the domain reads them and writes open notes about problems. Group similar problems, count them, and prioritize the ones worth addressing. That is error analysis."
- Early notes describe observed problems without requiring a complete rubric. The FAQ calls this open coding; grouping notes into failure categories is axial coding. Keep the jargon in the notes unless someone asks.
- Point along the second row: "Once we understand an important failure, define what passing and failing mean. Use a code check for an objective rule, or a judge for a judgment call. Check whether that evaluator works, then use the confirmed examples as a repeatable eval set."
- Validation differs by method: code checks need passing, failing and edge-case tests. Judges need trusted human Pass/Fail labels, development examples and a separate held-out test set. Early discovery notes and later calibration labels serve different purposes; the same trace may be reused where appropriate without contaminating the held-out set.
- For a judge, inspect disagreements with experts and measure both missed failures and false alarms. Keep the final test examples out of prompt tuning.
- Point to the return arrow: "Rerun on changes. New failures send us back to the traces. Criteria and datasets evolve with the product."
- TripMate teaching example: review the request and actual booking, describe a route mismatch, group that failure, define equality of the relevant requested and booked fields, test a structured check on correct and incorrect examples, and retain cases for reruns. The workshop's scripted case is a controlled teaching example, not evidence of production frequency.
- Not every observed problem needs an expensive evaluator. Fix obvious bugs directly and automate checks where their value warrants the effort. Synthetic data can help start discovery when real traces are unavailable, but needs review and cannot establish production failure rates.
- Source: FAQ questions on error analysis, when to write a rubric, how many examples are needed, and trusting automated evals. [1]

Sources:

1. [Hamel Husain and Shreya Shankar: AI Evals FAQ](https://hamel.dev/blog/posts/evals-faq/)

## Poll: which check fits each example?

| Example | Evidence and criterion |
| --- | --- |
| **1 · PNR format** | Rule: six uppercase letters or digits.<br>Returned PNR: `AB12`. Does it meet the format rule? |
| **2 · Booking accuracy** | Requested: DEL → BOM, **1 Nov**.<br>Booked: DEL → BOM, **2 Nov**. Message: “Your requested trip is booked.” |
| **3 · Reply tone** | The booking matches the request.<br>Reply: “Booked. Next time, try reading the instructions.” Criterion: polite and helpful. |
<!-- .element: class="comparison-table" -->

<div class="eval-poll-options"><span><strong>A</strong> · Regex / format check</span><span><strong>B</strong> · Structured comparison</span><span><strong>C</strong> · LLM judge with a rubric</span></div>

<p class="eval-poll-question">For each example: which check would you choose, and what evidence does it need?</p>

Three synthetic examples. Choose the simplest suitable check. <!-- .element: class="fine" -->

Note:
- Block 21 poll.
- Allow about 90 seconds: 15 seconds to read, then ask for an A/B/C choice and the evidence needed for each example. This fits inside Block 21; do not add a new time block.
- These are independent synthetic discussion examples, not new runnable TripMate cases. The six-character PNR rule is stipulated for this exercise, not asserted as a universal airline rule.
- Example 1: A is the simplest default. A full-string format check such as [A-Z0-9]{6} rejects AB12 because it is four characters long. Its input is the actual returned PNR, not just a success message. Matching the format does not establish that a booking exists or is correct.
- Example 2: B is the simplest default. Compare the structured requested date with the actual booking date: 1 Nov versus 2 Nov. Its inputs must include both request and booking. A regex that merely sees “booked” in the confirmation would pass the text while missing the wrong date. An LLM judge could also find the mismatch if given both records, but exact field equality does not require a model.
- Example 3: C is a reasonable default for judging tone across varied wording. Give the judge the user context, final reply, and a rubric for polite, respectful and helpful language. The structured booking check can pass while tone fails. A regex for this one phrase would not cover general tone, paraphrases or context.
- Human review can assess these examples and supplies reference labels for calibrating the tone judge. Do not present an LLM judge as infallible or treat human labels as automatically unanimous.
- Accept another method if the participant explains why it is suitable, what evidence it receives, and its cost or limitations. This is a choice of a sensible default, not a claim that only one method can evaluate each case.
- Close by asking: can a judge receiving only “Your requested trip is booked” verify the actual booking? No: it needs the request and the recorded booking outcome.
- Copy-ready format and tone evaluators are linked from speaker-notes/evaluator-setup.md for anyone who wants to implement the poll examples after the discussion.

## Why a good check can raise false alarms

<p class="monitor-lead">Illustration: 1,000 runs · 2% actually bad · 95% sensitivity and specificity</p>

<table class="monitor-matrix">
<thead><tr><th scope="col">What the check says</th><th scope="col">Actually bad: 20</th><th scope="col">Actually good: 980</th></tr></thead>
<tbody>
<tr><th scope="row">Flags a problem</th><td><strong>19</strong> true alarms</td><td><strong class="monitor-warn">49</strong> false alarms</td></tr>
<tr><th scope="row">Does not flag</th><td>1 missed failure</td><td>931 correct passes</td></tr>
</tbody>
</table>

<div class="fragment">
<div class="monitor-alarm-bar" role="img" aria-label="Of 68 flagged runs, 19 are true alarms and 49 are false alarms"><span style="width:27.941176%">19 true</span><span style="width:72.058824%">49 false</span></div>
<p class="monitor-equation">True alarms among flags = 19 ÷ (19 + 49) ≈ <strong>28%</strong></p>
</div>

<p class="monitor-takeaway">Rare failures amplify false alarms. Validate the check; inspect rates and counts.</p>

Note:
- Block 29. Use counts first; do not begin with Bayes notation.
- Script: "Imagine we know the ground truth. Of 1,000 runs, 20 are bad and 980 are good. A 95% sensitive check catches 19 of the 20 bad runs and misses one. A 95% specific check correctly clears 931 good runs, but incorrectly flags 49."
- Advance: "That gives 68 flags: 19 true and 49 false. If we notify on every flag, most notifications in this example are false, even though both sensitivity and specificity are 95%. Good runs are much more common."
- Sensitivity: share of actually bad runs detected. Specificity: share of actually good runs correctly cleared. Precision: share of flags that are actually bad. They answer different questions.
- Optional formula for a question: precision = (0.95 × 0.02) / ((0.95 × 0.02) + (0.05 × 0.98)) = 27.94%.
- The title applies to this hypothetical detector; it is not a claim that most real alerts everywhere are false. This is not a measured accuracy estimate for booking_matches_request.
- Important: averaging over a window does not fix a biased or inaccurate evaluator. Validate the check against known examples. Windowed rates reduce sensitivity to isolated fluctuations; sample counts show how much evidence supports the rate.
- Deterministic checks can also be wrong through incorrect criteria, inputs, or implementation. LLM judges need calibration against human labels.
- All counts and probabilities are a worked example, not workshop telemetry.

## ALERT vs NO_DATA

<p class="monitor-lead">Same window · condition: pass rate &lt; 90% · no-data mode: Show severity NO_DATA</p>

<div class="monitor-states">
<div><h3>Measured failures</h3><p>85 pass / 100 scores</p><p class="monitor-result">85%</p><p class="monitor-state">ALERT</p><p>We measured a breach.</p></div>
<div><h3>Every score failed</h3><p>0 pass / 100 scores</p><p class="monitor-result">0%</p><p class="monitor-state">ALERT</p><p>We measured zero passes.</p></div>
<div><h3>No scores arrived</h3><p>0 scores in the window</p><p class="monitor-result">?</p><p class="monitor-state">NO_DATA</p><p>We cannot calculate a rate.</p></div>
</div>

<p class="monitor-state-rule fragment">Default mode: missing → substitute 0 → ALERT<br>Selected mode: missing → NO_DATA</p>
<p class="monitor-takeaway">An empty thermometer display does not mean the temperature is zero.</p>

Note:
- Block 31 (02:26 to 02:31), 5 minutes.
- Start with the first two columns. "85 passes out of 100 is 85%. No passes out of 100 is a measured zero. Both breach our demo threshold."
- Point to the third. "No scores means no denominator. Zero divided by zero is undefined. We do not know the pass rate. NO_DATA expresses that uncertainty."
- Advance: "The default missing-data mode substitutes zero. That is a configured behavior, not evidence that all bookings failed. With Show severity NO_DATA, the alert reports the absence of scores instead."
- If rehearsed, show two real alerts over an empty window: default and NO_DATA modes. Do not promise the state before verifying the selected filters and window contain no scores. Existing scores remain in a rolling window until they age out.
- Then use uv run ws load -n 40 --case 2 --guard off only with the workshop's simulated LLM mode and the failing Case 2 behavior verified. Wait for evaluator scores and scheduled alert evaluation; inspect actual score values rather than claiming an immediate transition.
- The deterministic simulator supplies the wrong booking behavior; the evaluator and aggregation still demonstrate how alerts consume scores. It is not evidence of a real LLM failure rate.
- Show severity NO_DATA does not notify. Notify after sustained NO_DATA is a separate mode for expected traffic and scoring, with a delay.
- Missing scores can mean no traffic, evaluator failure or delay, ingestion delay, or filters that match nothing. The next slide distinguishes these.
- Prebuilt-alert states, interval and notification delivery still need live rehearsal. If unavailable, use these clearly illustrative numbers.

## Checkpoint 7: predict the state

<p class="monitor-lead">No matching scores in the window. Is TripMate failing, or are we missing measurements?</p>

```mermaid
flowchart LR
    missing["No matching scores"] --> traffic{"Matching TripMate traces?"}
    traffic -->|"Yes"| pipeline["Check evaluator, delay and filters"]
    traffic -->|"No"| quiet["Check traffic and trace ingestion"]
```

<p class="monitor-scenario">A. The evaluator stopped; booking traces continue.<br>B. Nobody made a booking request.</p>
<p class="monitor-equation fragment">Both can show <strong>NO_DATA</strong>. Trace counts help distinguish them.</p>
<p class="monitor-caption">Compare the same scope and period. Recent scores may still be processing.</p>

Note:
- Block 32 (02:31 to 02:36). Discuss until 02:35; keep the spare minute for earlier explanation.
- Ask before revealing: "In A, what would default missing-as-zero show under our pass-rate condition? What would NO_DATA mode show? Now consider B. Can score count alone distinguish them?"
- Reveal answer: default is ALERT in either case once the query returns no data; selected NO_DATA mode is NO_DATA in either case. It does not diagnose why scores are missing.
- A: matching traces exist but scores do not. Check evaluator execution, processing backlog or delay, score name/type, eligibility and alert filters.
- B: if no requests arrived, missing scores may be expected. Compare request traffic with trace ingestion too; no traces can also mean broken tracing rather than a quiet service.
- Use the same environment, TripMate trace scope, score name and lookback period. An evaluator sampling less than 100% needs an expected coverage baseline.
- In both scenarios the alert query must actually be empty. If earlier scores remain in the lookback window, the state may still reflect those scores.
- Say: "NO_DATA tells us a measurement is absent. We need another signal to explain the absence."

## Cost per successful task

<p class="monitor-lead">Illustration: 100 attempts use 300,000 tokens · only 90 succeed</p>

<div class="monitor-columns">
<div class="monitor-cost-bars" role="img" aria-label="3000 tokens per attempt compared with approximately 3333 tokens per successful task, about 11 percent higher">
<div><p>Per attempt: <strong>3,000 tokens</strong></p><span style="width:90%"></span></div>
<div class="fragment" data-fragment-index="0"><p>Per success: <strong>3,333 tokens</strong> · about 11% more</p><span style="width:100%"></span></div>
</div>
<div>
<p class="monitor-equation">300,000 ÷ 100 = 3,000<br><span class="fragment" data-fragment-index="0">300,000 ÷ 90 ≈ <strong>3,333</strong></span></p>
<p class="monitor-caption">The numerator includes usage from failed attempts and retries.</p>
</div>
</div>

<p class="monitor-takeaway">Cost per success = total cost of all attempts ÷ successful tasks</p>
<p class="monitor-caption">LLM cost = Σ (usage × applicable price), across calls and usage types.<br>Input and output prices differ. Simulated calls here are not provider charges.</p>

Note:
- Block 33 (02:36 to 02:39), 3 minutes including recap. About 2 minutes here.
- Start: "Our illustrative token budget is 3,000 per attempt. A hundred attempts use 300,000 tokens. That looks on budget. But ten attempts fail."
- Advance: "Only 90 tasks succeeded. The same 300,000 tokens bought 90 successes, so each success took about 3,333 tokens on average: 11% more. Failed work still consumed resources."
- The toy example assumes each attempt is a separate task, no retry later turns one of the 10 failures into a success, and every attempt uses 3,000 tokens. With retries, group attempts by task and count each successful task once.
- Tokens are a usage measure, not money. To compute dollar cost, sum each generation's input tokens times its input price and output tokens times its output price, plus any other billed usage categories. Then sum across all calls and attempts. Account for tool charges separately if applicable.
- Equal token counts need not have equal dollar cost when models, input/output mixes or caching differ. The bars compare tokens, not dollars.
- Langfuse accepts generation usage/cost; when a matching model price is available, it can calculate cost from usage. Explicit ingested cost takes precedence. [1]
- The workshop uses simulated LLM calls for fault cases. Any synthetic usage is illustrative, not a real provider bill. Real provider and evaluator calls, if enabled, are separate sources of actual spend.
- Say: "Track the cost of delivering the successful outcome, including the attempts that did not work."
- Definition of success here is the task outcome checked against intent, not simply absence of an exception or a fluent final message.

Sources:

1. [Langfuse: token and cost tracking](https://langfuse.com/docs/observability/features/token-and-cost-tracking)

## Instrumentation overhead and load testing

<div class="two-column">
<div>
<h3>Keep tracing cheap</h3>
<ul>
<li>Batch and export asynchronously</li>
<li>Tail-sample: keep all errors and slow runs, sample the rest</li>
<li>Keep attributes small</li>
</ul>
</div>
<div>
<h3>Load test safely</h3>
<ul>
<li>Stubbed tools and a recorded or mock model</li>
<li>Fixed concurrency, in a sandbox with no real side effects</li>
<li>Watch p95 latency, error rate and tokens per run</li>
</ul>
</div>
</div>

Note:
- Block 34 (02:47 to 02:50), 3 minutes. Talk-through, no lab.
- Batching: the OpenTelemetry SDK has a batching span processor that exports finished spans in batches. The simple processor exports each span as soon as it finishes. [1]
- Langfuse says its SDKs send trace data asynchronously in the background, queued locally and flushed in batches. [2]
- Tail sampling decides after it has seen the whole trace, so it can always keep traces with errors and sample on latency. [3]
- CAVEAT: tail sampling is hard to run. It needs a stateful component such as the Collector's tail sampling processor. [3]
- Langfuse's `sample_rate` is set in the client, and the SDK samples on the trace level. My reading: that is not tail sampling, so it cannot keep every error by itself. [4]
- If volume is small, keep everything and sample later. Details: Appendix, sampling and PII.
- Keep attributes small: my recommendation.
- Load testing: my recommendation.
    - Real tools have side effects, so stub them.
    - A real model costs tokens on every run and adds provider rate limits and noise, so use a recorded or mock model.
    - Fixed concurrency makes two runs comparable.
    - A sandbox means no real bookings, emails or payments, whatever the agent does.
- Latency and errors are two of the four golden signals. [5]
- Tokens per run is the Part 5 cost signal.
- This answers two survey questions: lightweight instrumentation, and sandboxing an agent for load testing.

## AI agent observability: the big picture

<p class="take-home-lead">Understand what an agent did, whether it helped the user, and how reliably it performs.</p>

<ol class="take-home-list" aria-label="Five questions you learned to answer">
<li><span class="check-box" aria-hidden="true">01</span><div><strong>What happened?</strong><span class="check-detail">A trace connects the request, model calls, tool calls and actual results.</span></div></li>
<li><span class="check-box" aria-hidden="true">02</span><div><strong>Did it do what the user wanted?</strong><span class="check-detail">Evaluations check the outcome. A tool returning OK can still mean the wrong booking.</span></div></li>
<li><span class="check-box" aria-hidden="true">03</span><div><strong>Where did it go wrong?</strong><span class="check-detail">Read the steps and compare the evidence with the request, not just the final message.</span></div></li>
<li><span class="check-box" aria-hidden="true">04</span><div><strong>How long did it take, and what did success cost?</strong><span class="check-detail">Look beyond averages: slow responses matter, and failed attempts still use resources.</span></div></li>
<li><span class="check-box" aria-hidden="true">05</span><div><strong>How will we know if it goes wrong again?</strong><span class="check-detail">Rerun saved tests and monitor live results. Missing measurements need attention too.</span></div></li>
</ol>

<p class="take-home-footer"><strong>Observe → evaluate → improve → monitor.</strong> <a href="take-home-summary.md">Keep this three-hour recap</a></p>

Note:
- Block 36, within 02:55 to 03:00. About 60 seconds here after the recap, then Thank you. This does not add time to the session.
- Say: "In three hours, you learned to answer five questions about an agent: what happened, whether it did what the user wanted, where it went wrong, how it performed, and how to catch the problem again. That is the big picture of AI agent observability."
- Point to each question and connect it to the workshop: the first trace; the booking comparison and evaluator; reading the request and tool evidence; mean versus percentiles and cost per success; saved examples and alerting.
- Keep this as a recap of ideas they understand, rather than an implementation checklist or a new lab. The linked handout repeats these five questions in plain language.
- Trace: a record of observable execution, not access to hidden model reasoning. Eval: a quality check that can itself be wrong. Human review helps define and validate it.
- Recovery: investigate, fix or guard the action, and rerun to verify the actual outcome. Preventing a wrong booking does not alone prove the requested booking succeeded.
- Performance: averages can hide slow requests; more sequential steps add work and opportunities for delay. Failed attempts and retries still consume resources.
- Monitoring: use measured rates with counts. An alert asks for investigation; it does not automatically fix the agent. NO_DATA means no matching measurements, which needs a different investigation from a measured breach.
- Close: "Observe, evaluate, improve, monitor. Keep checking the outcome the user wanted."

## Appendix: why more steps add delay

<p class="latency-lead">Assume each step independently has a <strong>1% chance of exceeding a slow threshold T</strong>.</p>

<div class="agent-tail-layout">
<div>
<p class="agent-tail-heading"><strong data-tail-count>10 steps</strong><span>Each square is a step in one request.</span></p>
<div class="agent-step-grid" data-agent-step-grid role="img" aria-label="10 active steps out of 100 possible steps"></div>
<div class="agent-risk-track" role="img" data-tail-risk-track aria-label="9.6 percent chance of at least one slow step"><span data-tail-risk-fill></span></div>
<p class="agent-risk-result"><strong data-tail-risk>9.6%</strong> encounter at least one slow step</p>
<p class="agent-risk-formula" data-tail-formula>1 − 0.99¹⁰ = 9.6%</p>
</div>
<div class="agent-timing-example">
<h3>One slow step can extend the wait</h3>
<pre><code class="mermaid">flowchart LR
A["LLM: 1 s"] --> B["Tool: 8 s"] --> C["LLM: 1 s"]</code></pre>
<p>Sequential total: <strong>1 + 8 + 1 = 10 s</strong><br>All three at 1 s: <strong>3 s</strong></p>
<p class="latency-caption">Timing example only. The probability model does not determine the extra seconds.</p>
</div>
</div>

<div class="latency-controls agent-tail-presets" aria-label="Choose the number of steps">
<button type="button" data-tail-preset="1" aria-pressed="false">1 step <span>1.0%</span></button>
<button type="button" data-tail-preset="10" aria-pressed="true">10 steps <span>9.6%</span></button>
<button type="button" data-tail-preset="25" aria-pressed="false">25 steps <span>22.2%</span></button>
<button type="button" data-tail-preset="100" aria-pressed="false">100 steps <span>63.4%</span></button>
<button type="button" data-tail-play>Animate 1 → 100</button>
<button type="button" data-tail-pause disabled>Pause</button>
</div>

<p class="agent-tail-derivation">P(no slow steps) = 0.99<sup>n</sup> &nbsp; → &nbsp; P(at least one) = 1 − 0.99<sup>n</sup></p>
<p class="latency-caption" data-tail-status role="status">Synthetic model. Independent steps, same slow probability. This is not the whole request’s p99.</p>

Note:
- Appendix only. This is a separate example from the 50 complete requests on slide 22.
- Define the unit: n is the number of steps inside one request. Slow means a step duration exceeds a chosen threshold T.
- State the assumptions before clicking: each step independently has probability q = 0.01 of being slow, and q is the same for every step. This is an illustrative model, not a measured property of TripMate.
- Click 1 step: a 1% chance of a slow step. Click 10 steps: 9.6%. Click 25: 22.2%. Click 100: 63.4%.
- Animate 1 to 100 gradually adds active blue squares and updates the calculated probability. Grey squares are possible additional steps, not completed steps or observed runs. No squares represent sampled failures.
- Pause to discuss any intermediate count. Clicking a preset stops the animation and sets an exact count. Motion off or reduced motion keeps the presets usable and disables playback. Leaving the slide stops playback.
- Derive the complement: a step has a 99% chance of not being slow. Independence lets us multiply: 0.99 raised to n is the chance none is slow. Subtract from 1 to include every case with one or more slow steps.
- The Mermaid diagram is a conditional timing example: if one tool takes 8 seconds and the other two steps take 1 second each, a sequential request takes 10 seconds instead of 3. It omits overhead. We have not inferred an 8-second delay from the probability formula.
- More sequential steps add baseline work and more opportunities for slow work. Parallel steps have a different total-time calculation: waiting for all results takes approximately the maximum duration rather than the sum, excluding overhead.
- Shared rate limits or a slow provider can make steps dependent. The product formula then need not hold. With unequal but independent probabilities qi, use 1 − product(1 − qi).
- This calculates the probability of encountering at least one slow step. It does not calculate request p99 or prove an end-to-end latency target was exceeded. Measure complete request durations for that.
- All probabilities and timing examples are my own calculations under the stated assumptions. The broader tail-latency motivation is discussed in The Tail at Scale. [1]

Sources:

1. [Dean and Barroso: The Tail at Scale](https://research.google/pubs/the-tail-at-scale/)

## Appendix: reliability compounding

- Per-step success multiplies: 0.95¹⁰ = 59.9%, 0.99¹⁰ = 90.4%
- 1 − 0.99ⁿ: n = 5 → 4.9%, 10 → 9.6%, 25 → 22.2%, 50 → 39.5%, 100 → 63.4%
- Assumes independent, identical steps. Real steps are correlated.

- Own calculations.

## Appendix: confidence intervals

| Result | 95% Wilson interval |
| --- | --- |
| 9/10 | 59.6% to 98.2% |
| 45/50 | 78.6% to 95.7% |
| 450/500 | 87.1% to 92.3% |
| 44/50 vs 46/50 | 76.2-94.4% vs 81.2-96.8%: they overlap |
<!-- .element: class="comparison-table" -->

±5 points at p = 0.5 needs about 384 samples; ±3 needs about 1,067. Rule of three: 0 failures in n runs → upper bound about 3/n. <!-- .element: class="smaller" -->

Note:
- Own calculations (Wilson score interval).
- Method reference: Wilson score interval. [1]
- Rule of three. [2]
